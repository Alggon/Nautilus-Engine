---
name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: init msvc
        uses: ilammy/msvc-dev-cmd@v1
      - name: configure
        run: cmake -B Package -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: compile
        run: cmake --build Package --target Editor
  
  test:
    runs-on: windows-latest
    needs: build
    steps:
      - name: configure
        run: cmake -B Package-Tests -G Ninja -DCMAKE_BUIKD_TYPE=Release
      - name: compile
        run: cmake --build Package-Tests --target RunTests
      - name: test
        run: ctest --test-dir Package-Tests --output-on-failure
---
name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: init msvc
        uses: ilammy/msvc-dev-cmd@v1
      - name: configure
        run: cmake -B Package -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: compile
        run: cmake --build Package --target Editor RunTests
      - name: test
        run: ctest --output-on-failure